app = "tender-snowflake-8461"
primary_region = "gru"

[build]
builder = "paketobuildpacks/builder:base"
buildpacks = ["paketobuildpacks/nodejs"]

[services]
http_port = 8080
build_command = "npm install && npm run build -w apps/bot"
start_command = "node apps/bot/dist/index.js"
env = { BOT_STORAGE = "supabase" }

[services]
[services.http]
port = 8080