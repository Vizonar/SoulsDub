# Runtime
runtime: node
nodeVersion: 20

# Build
buildCommand: npm install && npm run build -w apps/bot
startCommand: node apps/bot/dist/index.js
healthCheckPath: /api/health

# Variáveis (configure no dashboard do Render):
# DATABASE_URL=postgresql://...            (connection string do Neon)
# BOT_STORAGE=neon                         (neon = Postgres; memory só para teste)
# DISCORD_TOKEN=...
# DISCORD_CLIENT_ID=...
# DISCORD_GUILD_ID=...
# WEB_ORIGIN=https://soulsdub-jgrm-green.vercel.app